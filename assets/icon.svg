<!--
  Extension icon — fingertip tapping a git commit.

  Style references the user-provided Screenshot 2026-05-26 17.54.46.png:
  a top-down view of an index fingertip with a dashed "tap halo" arc
  above, drawn in heavy outline.

  Composition (viewBox 0 0 256 256):
    - Top half: dashed semicircle arc (the "tap" halo)
    - Middle: fingertip outline with cuticle + nail shape (open path)
    - Bottom: two short horizontal bars replaced with a tiny git branch
      glyph (3 commit dots on a single line) so the icon reads as
      "tap to commit" rather than "tap a button".

  Pure currentColor strokes so it themes correctly in any VSCode color
  scheme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">

  <!-- Dashed tap-halo arc above the fingertip -->
  <path d="M 60 110 A 68 68 0 0 1 196 110" stroke-dasharray="14 16"/>

  <!-- Fingertip silhouette: rounded top arch, parallel sides going down -->
  <path d="
    M 76 132
    L 76 244
    M 180 132
    L 180 244
    M 76 132
    A 52 52 0 0 1 180 132
  "/>

  <!-- Fingernail (small inner arch) -->
  <path d="
    M 108 152
    L 108 198
    Q 108 208 118 208
    L 138 208
    Q 148 208 148 198
    L 148 152
    Q 148 122 128 122
    Q 108 122 108 152
    Z
  "/>

  <!-- Git branch glyph at the base of the finger pad: 3 dots on a horizontal
       line — the canonical "git log graph" silhouette in miniature. -->
  <line x1="88" y1="232" x2="168" y2="232"/>
  <circle cx="98" cy="232" r="6" fill="currentColor"/>
  <circle cx="128" cy="232" r="6" fill="currentColor"/>
  <circle cx="158" cy="232" r="6" fill="currentColor"/>
</svg>
