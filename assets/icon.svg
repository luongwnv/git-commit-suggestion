<!--
  Extension icon — fingertip tapping a commit list on a smartphone screen,
  surrounded by sparkles. Faithful redraw of assets/icon.png as inline
  SVG so the icon scales cleanly and themes via currentColor.

  Composition (viewBox 0 0 256 256, original 800x800):
    - Top-left: 4-point sparkle (the bigger ✨)
    - Top-right: a plus (+)
    - A few scattered small dots (top-right + middle-left + middle-right)
    - Centre: smartphone outline (rounded rectangle, ~134x224)
    - Inside the phone, top half: an avatar/file square + three text lines
      (the "commit summary header" row)
    - Inside the phone, middle: 4 full-width text lines (the body)
    - Inside the phone, lower-middle: an avatar/file square on the right + two
      text lines on the left (the next commit row)
    - Bottom: fingertip outline emerging from below the phone, with a
      dashed tap-halo arc around it (the "press" indicator)
  All paths share currentColor so the icon themes for any background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">

  <!-- ====== Sparkles & dots around the phone ====== -->
  <!-- Top-left big 4-point sparkle -->
  <path d="M 22 22 L 30 12 L 38 22 L 30 32 Z" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="22" r="2.4" fill="white" stroke="none"/>
  <!-- Top-right plus -->
  <path d="M 236 56 v 14 M 229 63 h 14" stroke-width="6"/>
  <!-- Scattered dots -->
  <circle cx="18" cy="110" r="2.6" fill="currentColor" stroke="none"/>
  <circle cx="36" cy="170" r="3" fill="currentColor" stroke="none"/>
  <circle cx="232" cy="152" r="3" fill="currentColor" stroke="none"/>
  <circle cx="244" cy="240" r="2.4" fill="currentColor" stroke="none"/>

  <!-- ====== Phone outline ====== -->
  <rect x="64" y="6" width="134" height="224" rx="14"/>

  <!-- ====== First commit row: square avatar + 3 short lines ====== -->
  <rect x="80" y="28" width="22" height="22" rx="2"/>
  <line x1="112" y1="32" x2="178" y2="32"/>
  <line x1="112" y1="42" x2="166" y2="42"/>
  <line x1="112" y1="52" x2="178" y2="52"/>

  <!-- ====== Body: four full-width lines ====== -->
  <line x1="80" y1="76" x2="180" y2="76"/>
  <line x1="80" y1="90" x2="180" y2="90"/>
  <line x1="80" y1="104" x2="180" y2="104"/>
  <line x1="80" y1="118" x2="168" y2="118"/>

  <!-- ====== Second commit row: 2 short lines on left + square avatar on right ====== -->
  <line x1="80" y1="146" x2="146" y2="146"/>
  <line x1="80" y1="158" x2="146" y2="158"/>
  <rect x="156" y="140" width="22" height="22" rx="2"/>

  <!-- ====== Dashed tap-halo arc just above the fingertip ====== -->
  <path d="M 98 200 A 30 30 0 0 1 158 200" stroke-dasharray="6 6"/>

  <!-- ====== Fingertip: arched tip + parallel sides going down past phone ====== -->
  <path d="
    M 102 218
    A 26 26 0 0 1 154 218
    L 154 250
    M 102 218
    L 102 250
  "/>
  <!-- Fingernail inside the fingertip -->
  <path d="
    M 118 222
    L 118 232
    M 138 222
    L 138 232
    M 118 222
    A 10 10 0 0 1 138 222
    Z
  "/>
</svg>
