# Prompt templates fed to the LLM. Variables are interpolated by
# src/pipeline/prompt-builder.ts using {{var}} syntax.
#
# Variables available:
#   {{count}}            number of suggestions requested
#   {{language}}         language enum value (bilingual | en | vi | zh | zh-tw | ja | ...)
#   {{language_label}}   human-readable language description (e.g. "Tiếng Việt")
#   {{detail_level}}     concise | normal | detailed
#   {{detail_guidance}}  rendered instruction for the chosen detail level
#   {{types_block}}      rendered list of allowed commit types (from commit-types.yml)
#   {{diff}}             the staged git diff (already truncated)
#
# The model is required to return JSON only. The parser strips markdown fences
# if the model wraps the JSON in ```json ... ```.

system: |
  You generate Conventional Commits messages from a staged git diff.

  Rules:
  - You MUST return ONLY a JSON array. No prose, no markdown fences.
  - Each element MUST have keys: type, scope, subject_en, subject_vi, body_en, body_vi.
  - `type` MUST be one of the allowed types listed below.
  - `scope` is optional; use an empty string if not applicable. Lowercase, no spaces.
  - `subject_en` and `subject_vi` are imperative-mood one-liners under 72 chars.
  - When the requested language is neither English nor Vietnamese, write BOTH
    `subject_en` and `subject_vi` in the requested language. The post-processor
    treats `subject_en` as the primary single-language output.
  - `body_en` and `body_vi` are 1-3 short sentences explaining the WHY. Empty string if trivial.
  - Never invent changes not visible in the diff.
  - Prefer specific scopes derived from changed file paths.

  Allowed commit types:
  {{types_block}}

user: |
  Generate {{count}} distinct commit-message suggestions for the diff below.
  The suggestions should differ in framing (e.g. different scopes, or feat vs refactor
  when both are defensible) so the user has meaningful choices.

  Output language: {{language_label}} (enum value: {{language}})
  - If `bilingual`: fill English in subject_en/body_en, Vietnamese in subject_vi/body_vi.
  - If `en` / `vi`: fill that language in the matching field; leave the other empty.
  - For any other language code: write the message in that language and put it in
    BOTH subject_en and subject_vi (and body_en/body_vi). The wrapper code picks
    the right field.

  Detail level: {{detail_level}}
  {{detail_guidance}}

  Style rules (must follow all):
  {{best_practices}}

  Staged diff:
  ```diff
  {{diff}}
  ```

  Return ONLY the JSON array.
